<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Kiểm Kê Tài Sản QR</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- QR Scanner Library -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body class="bg-light">

    <div class="container py-4">
        <h2 class="text-center mb-4 text-primary fw-bold">KIỂM KÊ TÀI SẢN TRỰC TUYẾN</h2>

        <!-- Chọn đợt kiểm kê & Cán bộ -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Đợt Kiểm Kê:</label>
                        <select id="selectDot" class="form-select">
                            <option value="">Đang tải đợt kiểm kê...</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Cán Bộ Kiểm Kê:</label>
                        <input type="text" id="txtNguoiKK" class="form-control" value="Nguyễn Cao Mẫn" placeholder="Nhập tên cán bộ...">
                    </div>
                </div>
            </div>
        </div>

        <!-- Khung Quét QR -->
        <div class="card shadow-sm mb-4">
            <div class="card-body text-center">
                <h5 class="card-title mb-3">Quét Mã QR Tài Sản</h5>
                <div id="reader" style="width: 100%; max-width: 400px; margin: auto;"></div>
                <div id="scan-result" class="mt-3 fw-bold text-success"></div>
            </div>
        </div>

        <!-- Danh sách tài sản đã kiểm kê -->
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                <h5 class="mb-0">Lịch Sử Kiểm Kê</h5>
                <button class="btn btn-light btn-sm" onclick="loadData()">Làm mới</button>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle">
                        <thead>
                            <tr>
                                <th>STT</th>
                                <th>Mã TS</th>
                                <th>Tên Tài Sản</th>
                                <th>Người Kiểm Kê</th>
                                <th>Thời Gian</th>
                                <th>Ghi Chú</th>
                            </tr>
                        </thead>
                        <tbody id="tableHistory">
                            <tr>
                                <td colspan="6" class="text-center text-muted">Đang tải dữ liệu...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Script xử lý logic -->
    <script>
        // THAY ĐƯỜNG DẪN API VERCEL CỦA BẠN VÀO ĐÂY
        const API_URL = 'https://kiem-ke-tai-san.vercel.app/api';

        let danhSachTS = [];
        let dotKiemKeList = [];

        // 1. Tải dữ liệu ban đầu từ API
        async function loadData() {
            try {
                const response = await fetch(`${API_URL}?action=data`);
                const result = await response.json();
                if (result.success) {
                    danhSachTS = result.danh_sach;
                    dotKiemKeList = result.dot_kiem_ke;
                    
                    // Đổ dữ liệu vào Select Đợt kiểm kê
                    const selectDot = document.getElementById('selectDot');
                    selectDot.innerHTML = '';
                    dotKiemKeList.forEach(d => {
                        selectDot.innerHTML += `<option value="${d.id}">${d.name}</option>`;
                    });

                    // Đổ dữ liệu vào bảng lịch sử
                    const tbody = document.getElementById('tableHistory');
                    tbody.innerHTML = '';
                    if (result.lich_su.length === 0) {
                        tbody.innerHTML = `<tr><td colspan="6" class="text-center text-muted">Chưa có tài sản nào được kiểm kê.</td></tr>`;
                    } else {
                        result.lich_su.forEach((item, index) => {
                            tbody.innerHTML += `
                                <tr>
                                    <td>${index + 1}</td>
                                    <td><span class="badge bg-secondary">${item.tsId}</span></td>
                                    <td>${item.tsName}</td>
                                    <td>${item.nguoiKK}</td>
                                    <td>${item.thoiGian}</td>
                                    <td>${item.ghiChu}</td>
                                </tr>
                            `;
                        });
                    }
                }
            } catch (err) {
                console.error('Lỗi tải dữ liệu:', err);
            }
        }

        // 2. Gửi dữ liệu khi quét QR thành công
        async function onScanSuccess(decodedText, decodedResult) {
            // Ngưng quét tạm thời hoặc xử lý mã QR nhận được (giả sử nội dung QR là mã ID tài sản, ví dụ: TS001)
            const tsId = decodedText.trim();
            const dotId = document.getElementById('selectDot').value;
            const nguoiKK = document.getElementById('txtNguoiKK').value || 'Nhân viên';

            // Tìm thông tin tài sản theo ID
            const asset = danhSachTS.find(t => t.id === tsId);
            const tsName = asset ? asset.name : `Tài sản quét (${tsId})`;
            const thoiGian = new Date().toLocaleString('vi-VN');

            document.getElementById('scan-result').innerText = `Đã quét mã: ${tsId} - Đang lưu...`;

            try {
                const response = await fetch(`${API_URL}?action=history`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ dotId, tsId, tsName, nguoiKK, thoiGian, ghiChu: 'Quét QR qua Web' })
                });
                const result = await response.json();
                if (result.success) {
                    document.getElementById('scan-result').innerText = `Thành công: Đã ghi nhận ${tsName}!`;
                    loadData(); // Tải lại bảng lịch sử
                } else {
                    document.getElementById('scan-result').innerText = `Lỗi: ${result.error}`;
                }
            } catch (err) {
                document.getElementById('scan-result').innerText = `Lỗi kết nối máy chủ!`;
            }

            // Cho phép quét tiếp sau 3 giây
            setTimeout(() => {
                document.getElementById('scan-result').innerText = '';
            }, 3000);
        }

        // Khởi động Camera quét QR
        const html5QrcodeScanner = new Html5QrcodeScanner(
            "reader", { fps: 10, qrbox: 250 }, false
        );
        html5QrcodeScanner.render(onScanSuccess, (err) => { /* Bỏ qua lỗi quét liên tục */ });

        // Gọi load dữ liệu lần đầu khi mở trang
        loadData();
    </script>
</body>
</html>
