<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Kiểm Kê Tài Sản QR</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- QR Scanner Library -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body { background-color: #f4f7f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { border: none; border-radius: 12px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05); }
        .card-header { border-radius: 12px 12px 0 0 !important; }
        #reader { border: 2px dashed #0d6efd; border-radius: 8px; padding: 10px; background: #fff; }
        #reader video { border-radius: 6px; }
    </style>
</head>
<body>

    <div class="container py-4">
        <!-- Header -->
        <div class="text-center mb-4">
            <h2 class="fw-bold text-primary"><i class="fa-solid fa-qrcode me-2"></i>KIỂM KÊ TÀI SẢN TRỰC TUYẾN</h2>
            <p class="text-muted">Hệ thống quét mã QR kết nối cơ sở dữ liệu thời gian thực</p>
        </div>

        <!-- Cấu hình Đợt & Cán bộ -->
        <div class="card mb-4">
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold text-secondary"><i class="fa-solid fa-calendar-days me-1"></i> Đợt Kiểm Kê:</label>
                        <select id="selectDot" class="form-select">
                            <option value="">Đang tải đợt kiểm kê...</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold text-secondary"><i class="fa-solid fa-user-tie me-1"></i> Cán Bộ Kiểm Kê:</label>
                        <input type="text" id="txtNguoiKK" class="form-control" value="Nguyễn Cao Mẫn" placeholder="Nhập tên cán bộ...">
                    </div>
                </div>
            </div>
        </div>

        <!-- Khung Quét QR -->
        <div class="card mb-4 text-center">
            <div class="card-body">
                <h5 class="card-title fw-bold text-dark mb-3"><i class="fa-solid fa-camera me-1"></i> Quét Mã QR Tài Sản</h5>
                <div id="reader" style="width: 100%; max-width: 400px; margin: auto;"></div>
                <div id="scan-result" class="mt-3 fw-bold fs-6"></div>
            </div>
        </div>

        <!-- Lịch sử kiểm kê -->
        <div class="card">
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center py-3">
                <h5 class="mb-0"><i class="fa-solid fa-clock-rotate-left me-2"></i> Lịch Sử Kiểm Kê</h5>
                <button class="btn btn-light btn-sm fw-semibold" onclick="loadData()"><i class="fa-solid fa-rotate me-1"></i> Làm mới</button>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>STT</th>
                                <th>Mã TS</th>
                                <th>Tên Tài Sản</th>
                                <th>Cán Bộ KK</th>
                                <th>Thời Gian</th>
                                <th>Ghi Chú</th>
                            </tr>
                        </thead>
                        <tbody id="tableHistory">
                            <tr>
                                <td colspan="6" class="text-center text-muted py-3">Đang tải dữ liệu...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Script xử lý logic -->
    <script>
        // ĐƯỜNG DẪN API VERCEL CỦA BẠN (Đã bao gồm đuôi /api)
        const API_URL = 'https://kiem-ke-tai-san-vercel.vercel.app/api';

        let danhSachTS = [];

        // 1. Tải dữ liệu ban đầu từ API
        async function loadData() {
            try {
                const response = await fetch(`${API_URL}?action=data`);
                const result = await response.json();
                if (result.success) {
                    danhSachTS = result.danh_sach;
                    
                    // Đổ dữ liệu vào Select Đợt kiểm kê
                    const selectDot = document.getElementById('selectDot');
                    selectDot.innerHTML = '';
                    result.dot_kiem_ke.forEach(d => {
                        selectDot.innerHTML += `<option value="${d.id}">${d.name}</option>`;
                    });

                    // Đổ dữ liệu vào bảng lịch sử
                    const tbody = document.getElementById('tableHistory');
                    tbody.innerHTML = '';
                    if (result.lich_su.length === 0) {
                        tbody.innerHTML = `<tr><td colspan="6" class="text-center text-muted py-3">Chưa có tài sản nào được kiểm kê.</td></tr>`;
                    } else {
                        result.lich_su.forEach((item, index) => {
                            tbody.innerHTML += `
                                <tr>
                                    <td>${index + 1}</td>
                                    <td><span class="badge bg-secondary">${item.tsId}</span></td>
                                    <td class="fw-semibold text-dark">${item.tsName}</td>
                                    <td>${item.nguoiKK}</td>
                                    <td class="text-muted small">${item.thoiGian}</td>
                                    <td><span class="badge bg-success-subtle text-success border border-success-subtle">${item.ghiChu}</span></td>
                                </tr>
                            `;
                        });
                    }
                }
            } catch (err) {
                console.error('Lỗi tải dữ liệu:', err);
            }
        }

        // 2. Gửi dữ liệu khi quét QR thành công
        async function onScanSuccess(decodedText) {
            const tsId = decodedText.trim();
            const dotId = document.getElementById('selectDot').value;
            const nguoiKK = document.getElementById('txtNguoiKK').value || 'Nhân viên';

            // Tìm thông tin tài sản theo ID quét được
            const asset = danhSachTS.find(t => t.id === tsId);
            const tsName = asset ? asset.name : `Tài sản quét (${tsId})`;
            const thoiGian = new Date().toLocaleString('vi-VN');

            const resultDiv = document.getElementById('scan-result');
            resultDiv.className = 'mt-3 fw-bold text-warning';
            resultDiv.innerText = `Đang xử lý mã: ${tsId}...`;

            try {
                const response = await fetch(`${API_URL}?action=history`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ dotId, tsId, tsName, nguoiKK, thoiGian, ghiChu: 'Quét QR Online' })
                });
                const result = await response.json();
                
                if (result.success) {
                    resultDiv.className = 'mt-3 fw-bold text-success';
                    resultDiv.innerHTML = `<i class="fa-solid fa-circle-check me-1"></i> Thành công: Đã ghi nhận ${tsName}!`;
                    loadData(); // Tải lại bảng lịch sử ngay lập tức
                } else {
                    resultDiv.className = 'mt-3 fw-bold text-danger';
                    resultDiv.innerHTML = `<i class="fa-solid fa-triangle-exclamation me-1"></i> ${result.error}`;
                }
            } catch (err) {
                resultDiv.className = 'mt-3 fw-bold text-danger';
                resultDiv.innerText = `Lỗi kết nối máy chủ!`;
            }

            // Xóa thông báo sau 4 giây
            setTimeout(() => {
                resultDiv.innerText = '';
            }, 4000);
        }

        // Khởi động Camera quét QR
        const html5QrcodeScanner = new Html5QrcodeScanner(
            "reader", { fps: 10, qrbox: 250 }, false
        );
        html5QrcodeScanner.render(onScanSuccess, (err) => { /* Bỏ qua lỗi quét liên tục khung hình */ });

        // Gọi load dữ liệu lần đầu khi mở trang
        loadData();
    </script>
</body>
</html>
