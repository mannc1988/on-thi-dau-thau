<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thi Trắc Nghiệm: Kiến Thức Đấu Thầu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .quiz-container { max-width: 800px; margin: 50px auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .question { margin-bottom: 20px; font-weight: bold; }
        .option-label { display: block; margin-bottom: 10px; cursor: pointer; padding: 10px; border: 1px solid #dee2e6; border-radius: 5px; transition: background-color 0.2s; }
        .option-label:hover { background-color: #e9ecef; }
        input[type="radio"] { margin-right: 10px; }
        #result { display: none; margin-top: 20px; }
    </style>
</head>
<body>

<div class="container quiz-container">
    <h2 class="text-center text-primary mb-4">Bài Thi Trắc Nghiệm Đấu Thầu</h2>
    <div id="quiz-body">
        </div>
    <div class="text-center mt-4">
        <button id="submit-btn" class="btn btn-success btn-lg" onclick="calculateScore()">Nộp Bài</button>
    </div>
    
    <div id="result" class="alert alert-info text-center fs-4"></div>
</div>

<script>
    // Bộ câu hỏi về Đấu thầu (Có thể mở rộng thêm)
    const questions = [
        {
            question: "Câu 1: Theo Luật Đấu thầu, đâu là hình thức lựa chọn nhà thầu phổ biến nhất?",
            options: ["Đấu thầu rộng rãi", "Đấu thầu hạn chế", "Chỉ định thầu", "Chào hàng cạnh tranh"],
            answer: 0
        },
        {
            question: "Câu 2: Thời gian chuẩn bị hồ sơ dự thầu đối với đấu thầu rộng rãi trong nước tối thiểu là bao nhiêu ngày?",
            options: ["10 ngày", "15 ngày", "20 ngày", "30 ngày"],
            answer: 2
        },
        {
            question: "Câu 3: Đảm bảo dự thầu đối với gói thầu xây lắp quy mô nhỏ được quy định ở mức nào?",
            options: ["Từ 1% đến 1.5%", "Từ 1% đến 3%", "Từ 2% đến 3%", "Từ 1% đến 2%"],
            answer: 0
        }
    ];

    // Hàm trộn mảng (Fisher-Yates Shuffle) để đảo câu hỏi và đáp án
    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    let currentQuizData = [];

    // Hàm khởi tạo bài thi
    function loadQuiz() {
        // Sao chép và trộn câu hỏi
        currentQuizData = JSON.parse(JSON.stringify(questions));
        shuffleArray(currentQuizData);

        const quizBody = document.getElementById('quiz-body');
        quizBody.innerHTML = '';

        currentQuizData.forEach((q, index) => {
            // Lưu lại đáp án đúng trước khi trộn options
            const correctAnswerText = q.options[q.answer];
            
            // Trộn các lựa chọn
            shuffleArray(q.options);
            
            // Cập nhật lại index của đáp án đúng sau khi trộn
            q.newAnswerIndex = q.options.indexOf(correctAnswerText);

            let questionHTML = `<div class="mb-4">
                <div class="question">${index + 1}. ${q.question.split(': ')[1] || q.question}</div>`;
            
            q.options.forEach((opt, optIndex) => {
                questionHTML += `
                    <label class="option-label">
                        <input type="radio" name="question${index}" value="${optIndex}">
                        ${String.fromCharCode(65 + optIndex)}. ${opt}
                    </label>
                `;
            });
            questionHTML += `</div>`;
            quizBody.innerHTML += questionHTML;
        });
    }

    // Hàm tính điểm
    function calculateScore() {
        let score = 0;
        let total = currentQuizData.length;

        currentQuizData.forEach((q, index) => {
            const selectedOption = document.querySelector(`input[name="question${index}"]:checked`);
            if (selectedOption) {
                const answerValue = parseInt(selectedOption.value);
                if (answerValue === q.newAnswerIndex) {
                    score++;
                }
            }
        });

        const resultDiv = document.getElementById('result');
        resultDiv.style.display = 'block';
        resultDiv.innerHTML = `Bạn đã trả lời đúng <strong>${score} / ${total}</strong> câu hỏi.`;
        
        // Vô hiệu hóa nút nộp bài sau khi nhấn
        document.getElementById('submit-btn').disabled = true;
    }

    // Tải câu hỏi khi trang vừa load xong
    window.onload = loadQuiz;
</script>
</body>
</html>
