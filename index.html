<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Khảo thí BIDV</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        /* --- BỘ MÀU THƯƠNG HIỆU BIDV --- */
        :root {
            --bidv-green: #0F6C5D;       /* Xanh ngọc lục bảo */
            --bidv-green-hover: #0c594c;
            --bidv-yellow: #F4B313;      /* Vàng mai */
            --bidv-yellow-hover: #e0a310;
            --bidv-light-green: #e9f2f0; /* Nền xanh nhạt */
            --bg-color: #f4f6f9;
        }

        body { background-color: var(--bg-color); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        /* Header */
        .header-top { background: var(--bidv-green); color: white; padding: 15px 0; box-shadow: 0 4px 10px rgba(0,0,0,0.15); border-bottom: 4px solid var(--bidv-yellow); }
        .brand-logo { font-family: 'Arial Black', sans-serif; font-weight: 900; letter-spacing: 2px; color: white; font-size: 1.6rem; margin: 0; display: flex; align-items: center;}
        .brand-logo span { color: var(--bidv-yellow); margin-right: 10px; }
        
        /* Timer */
        .timer-box { font-size: 1.25rem; font-weight: bold; background: var(--bidv-yellow); color: #000; padding: 6px 18px; border-radius: 25px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); display: flex; align-items: center;}
        
        /* Cards */
        .question-card, .palette-card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .question-card { min-height: 400px; display: none; animation: fadeIn 0.3s; border-top: 5px solid var(--bidv-green); }
        .question-card.active { display: block; }
        .question-title { font-size: 1.25rem; font-weight: 600; margin-bottom: 25px; color: var(--bidv-green); }
        
        /* Options */
        .option-label { display: block; margin-bottom: 12px; cursor: pointer; padding: 16px; border: 1px solid #dce1e6; border-radius: 8px; transition: all 0.2s ease; font-size: 1.05rem; }
        .option-label:hover { background-color: #f8f9fa; border-color: var(--bidv-green); }
        .option-label.selected { background-color: var(--bidv-light-green); border-color: var(--bidv-green); font-weight: 600; color: var(--bidv-green); box-shadow: 0 2px 5px rgba(15, 108, 93, 0.1); }
        input[type="radio"] { display: none; }
        
        /* Buttons */
        .btn-bidv { background-color: var(--bidv-green); color: white; border: none; font-weight: 500; }
        .btn-bidv:hover { background-color: var(--bidv-green-hover); color: white; }
        .btn-bidv-yellow { background-color: var(--bidv-yellow); color: #000; border: none; font-weight: bold; }
        .btn-bidv-yellow:hover { background-color: var(--bidv-yellow-hover); color: #000; }
        
        /* Sơ đồ câu hỏi */
        .q-btn { width: 42px; height: 42px; margin: 6px; border-radius: 8px; font-weight: bold; border: 1px solid #dce1e6; background: white; transition: 0.2s; color: #555;}
        .q-btn.answered { background-color: var(--bidv-green); color: white; border-color: var(--bidv-green); }
        .q-btn.current { border: 2px solid var(--bidv-yellow); background-color: #fffaf0; color: #000; box-shadow: 0 0 8px rgba(244, 179, 19, 0.4); }
        .q-btn.answered.current { background-color: var(--bidv-green); color: white; border: 2px solid var(--bidv-yellow); }

        /* Progress bar */
        .progress { background-color: #e9ecef; border-radius: 10px; }
        .progress-bar { background-color: var(--bidv-green); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        #result-screen { display: none; }
    </style>
</head>
<body>

<!-- Header BIDV -->
<div class="header-top sticky-top">
    <div class="container d-flex justify-content-between align-items-center">
        <h1 class="brand-logo"><span>BIDV</span> HỆ THỐNG KHẢO THÍ</h1>
        <div class="timer-box" id="timer-display">
            <i class="bi bi-alarm-fill me-2"></i> <span id="time">00:00</span>
        </div>
    </div>
</div>

<!-- Main Content -->
<div class="container mt-4" id="exam-screen">
    <div class="row">
        <!-- Khu vực câu hỏi -->
        <div class="col-lg-8 col-md-7 mb-4">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <span class="fw-bold" style="color: var(--bidv-green);">Tiến độ làm bài</span>
            </div>
            <div class="progress mb-4" style="height: 12px;">
                <div id="progress-bar" class="progress-bar" role="progressbar" style="width: 0%; transition: width 0.4s ease;"></div>
            </div>
            
            <div id="quiz-body">
                <!-- Câu hỏi sẽ render tại đây -->
            </div>

            <!-- Nút điều hướng -->
            <div class="d-flex justify-content-between mt-4">
                <button class="btn btn-outline-secondary px-4 py-2" id="btn-prev" onclick="changeQuestion(-1)">
                    <i class="bi bi-arrow-left-circle me-1"></i> Câu trước
                </button>
                <button class="btn btn-bidv px-4 py-2" id="btn-next" onclick="changeQuestion(1)">
                    Câu tiếp theo <i class="bi bi-arrow-right-circle ms-1"></i>
                </button>
            </div>
        </div>

        <!-- Khu vực điều khiển & Sơ đồ câu hỏi -->
        <div class="col-lg-4 col-md-5">
            <div class="palette-card sticky-top" style="top: 100px;">
                <h5 class="text-center mb-4 fw-bold" style="color: var(--bidv-green);">DANH SÁCH CÂU HỎI</h5>
                <div class="d-flex flex-wrap justify-content-center" id="question-palette">
                    <!-- Nút sơ đồ sẽ render tại đây -->
                </div>
                <hr class="my-4">
                <div class="d-flex justify-content-between mb-4" style="font-size: 0.9rem;">
                    <span><span class="badge" style="background-color: var(--bidv-green); width:18px;height:18px;display:inline-block;vertical-align:middle;"></span> Đã làm</span>
                    <span><span class="badge border" style="background-color: white; color: #000; width:18px;height:18px;display:inline-block;vertical-align:middle;"></span> Chưa làm</span>
                </div>
                <button id="submit-btn" class="btn btn-bidv-yellow w-100 py-3 text-uppercase" onclick="confirmSubmit()">
                    <i class="bi bi-send-check-fill me-2"></i> Nộp Bài Thi
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Màn hình kết quả -->
<div class="container mt-5" id="result-screen">
    <div class="row justify-content-center">
        <div class="col-md-7 text-center bg-white p-5 shadow-sm" style="border-radius: 20px; border-top: 8px solid var(--bidv-green);">
            <div class="brand-logo justify-content-center mb-4 text-dark"><span>BIDV</span></div>
            <i class="bi bi-award-fill text-warning mb-3" style="font-size: 5rem; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));"></i>
            <h2 class="fw-bold" style="color: var(--bidv-green);">Hoàn Thành Bài Thi!</h2>
            <div class="fs-4 mt-4 mb-4" id="result-text"></div>
            <button class="btn btn-bidv px-5 py-2 mt-3" onclick="location.reload()">
                <i class="bi bi-arrow-counterclockwise me-1"></i> Làm lại bài thi
            </button>
        </div>
    </div>
</div>

<script>
    // --- CẤU HÌNH BÀI THI ---
    const TOTAL_MINUTES = 5; 
    
    // Bộ câu hỏi (Bạn có thể thêm tùy ý)
    const questions = [
        {
            question: "Câu 1: Theo Luật Đấu thầu, đâu là hình thức lựa chọn nhà thầu phổ biến nhất?",
            options: ["Đấu thầu rộng rãi", "Đấu thầu hạn chế", "Chỉ định thầu", "Chào hàng cạnh tranh"],
            answer: 0
        },
        {
            question: "Câu 2: Thời gian chuẩn bị hồ sơ dự thầu đối với đấu thầu rộng rãi trong nước tối thiểu là bao nhiêu ngày?",
            options: ["10 ngày", "15 ngày", "20 ngày", "30 ngày"],
            answer: 2
        },
        {
            question: "Câu 3: Đảm bảo dự thầu đối với gói thầu xây lắp quy mô nhỏ được quy định ở mức nào?",
            options: ["Từ 1% đến 1.5%", "Từ 1% đến 3%", "Từ 2% đến 3%", "Từ 1% đến 2%"],
            answer: 0
        },
        {
            question: "Câu 4: Hình thức 'Chào hàng cạnh tranh' áp dụng cho gói thầu mua sắm hàng hóa có giá trị không quá bao nhiêu?",
            options: ["1 tỷ đồng", "3 tỷ đồng", "5 tỷ đồng", "10 tỷ đồng"],
            answer: 2
        },
        {
            question: "Câu 5: Trong đấu thầu, thuật ngữ 'Bảo lãnh thực hiện hợp đồng' có nghĩa vụ gì?",
            options: ["Đảm bảo nhà thầu không bỏ trốn", "Đảm bảo nhà thầu ký hợp đồng", "Đảm bảo trách nhiệm thực hiện hợp đồng đã ký", "Đảm bảo chất lượng thiết kế"],
            answer: 2
        }
    ];

    let currentQuizData = [];
    let currentIndex = 0;
    let timeRemaining = TOTAL_MINUTES * 60;
    let timerInterval;

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    function loadQuiz() {
        currentQuizData = JSON.parse(JSON.stringify(questions));
        shuffleArray(currentQuizData);

        const quizBody = document.getElementById('quiz-body');
        const palette = document.getElementById('question-palette');
        quizBody.innerHTML = '';
        palette.innerHTML = '';

        currentQuizData.forEach((q, index) => {
            const correctAnswerText = q.options[q.answer];
            shuffleArray(q.options);
            q.newAnswerIndex = q.options.indexOf(correctAnswerText);

            let questionHTML = `<div class="question-card" id="q-card-${index}">
                <div class="question-title">Câu ${index + 1}: ${q.question.split(': ')[1] || q.question}</div>`;
            
            q.options.forEach((opt, optIndex) => {
                questionHTML += `
                    <label class="option-label" id="label-q${index}-opt${optIndex}">
                        <input type="radio" name="question${index}" value="${optIndex}" onchange="selectAnswer(${index}, ${optIndex})">
                        <strong>${String.fromCharCode(65 + optIndex)}.</strong> ${opt}
                    </label>
                `;
            });
            questionHTML += `</div>`;
            quizBody.innerHTML += questionHTML;

            palette.innerHTML += `<button class="q-btn shadow-sm" id="btn-palette-${index}" onclick="goToQuestion(${index})">${index + 1}</button>`;
        });

        startTimer();
        updateUI();
    }

    function selectAnswer(qIndex, optIndex) {
        const labels = document.querySelectorAll(`#q-card-${qIndex} .option-label`);
        labels.forEach(lbl => lbl.classList.remove('selected'));
        document.getElementById(`label-q${qIndex}-opt${optIndex}`).classList.add('selected');
        document.getElementById(`btn-palette-${qIndex}`).classList.add('answered');
    }

    function changeQuestion(step) {
        let newIndex = currentIndex + step;
        if (newIndex >= 0 && newIndex < currentQuizData.length) {
            goToQuestion(newIndex);
        }
    }

    function goToQuestion(index) {
        currentIndex = index;
        updateUI();
    }

    function updateUI() {
        let total = currentQuizData.length;

        document.querySelectorAll('.question-card').forEach(card => card.classList.remove('active'));
        document.getElementById(`q-card-${currentIndex}`).classList.add('active');

        document.querySelectorAll('.q-btn').forEach(btn => btn.classList.remove('current'));
        document.getElementById(`btn-palette-${currentIndex}`).classList.add('current');

        document.getElementById('btn-prev').disabled = (currentIndex === 0);
        document.getElementById('btn-next').style.display = (currentIndex === total - 1) ? 'none' : 'block';

        let progress = ((currentIndex + 1) / total) * 100;
        document.getElementById('progress-bar').style.width = progress + '%';
    }

    function startTimer() {
        const timeDisplay = document.getElementById('time');
        
        timerInterval = setInterval(() => {
            timeRemaining--;
            
            let minutes = Math.floor(timeRemaining / 60);
            let seconds = timeRemaining % 60;
            
            timeDisplay.innerText = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;

            if(timeRemaining <= 60) {
                document.getElementById('timer-display').style.backgroundColor = "#dc3545";
                document.getElementById('timer-display').style.color = "#fff";
                document.getElementById('timer-display').style.animation = "fadeIn 1s infinite alternate";
            }

            if (timeRemaining <= 0) {
                clearInterval(timerInterval);
                alert("Hết giờ làm bài! Hệ thống tự động nộp bài.");
                calculateScore();
            }
        }, 1000);
    }

    function confirmSubmit() {
        if (confirm("Bạn có chắc chắn muốn nộp bài? Hãy kiểm tra lại các câu chưa làm (ô màu trắng).")) {
            calculateScore();
        }
    }

    function calculateScore() {
        clearInterval(timerInterval);
        
        let score = 0;
        let total = currentQuizData.length;

        currentQuizData.forEach((q, index) => {
            const selectedOption = document.querySelector(`input[name="question${index}"]:checked`);
            if (selectedOption) {
                const answerValue = parseInt(selectedOption.value);
                if (answerValue === q.newAnswerIndex) {
                    score++;
                }
            }
        });

        document.getElementById('exam-screen').style.display = 'none';
        document.querySelector('.header-top').style.display = 'none';
        
        const resultScreen = document.getElementById('result-screen');
        resultScreen.style.display = 'block';
        
        let percent = (score / total) * 100;
        let gradeText = percent >= 80 ? "<span class='text-success fw-bold'>Xuất sắc! Bạn đã vượt qua bài kiểm tra.</span>" : 
                        percent >= 50 ? "<span class='text-primary fw-bold'>Đạt yêu cầu.</span>" : 
                        "<span class='text-danger fw-bold'>Chưa đạt. Cần ôn tập thêm nghiệp vụ.</span>";

        document.getElementById('result-text').innerHTML = `
            Kết quả của bạn:<br> 
            <span style="font-size: 3rem; color: var(--bidv-green); font-weight: 900;">${score} / ${total}</span><br>
            <div class="mt-3 fs-5">${gradeText}</div>
        `;
    }

    window.onload = loadQuiz;
</script>
</body>
</html>
