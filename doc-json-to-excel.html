<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trình Đọc JSON Đa Năng & Xuất Excel</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- SheetJS (xlsx) để xử lý Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        body { background-color: #f4f7f6; color: #333; }
        .card { border: none; border-radius: 8px; }
        /* Tông màu sáng chủ đạo (Xanh dương sáng / Thanh lịch) */
        .card-header { background-color: #e3f2fd; color: #0d47a1; font-weight: bold; border-bottom: 1px solid #bbdefb; }
        .table-responsive { max-height: 450px; overflow-y: auto; }
        thead th { position: sticky; top: 0; background-color: #e3f2fd !important; color: #0d47a1 !important; z-index: 10; border-bottom: 2px solid #90caf9 !important; }
        .table-hover tbody tr:hover { background-color: #f1f8ff; }
        .bg-light-custom { background-color: #ffffff; border: 1px solid #e0e0e0; }
    </style>
</head>
<body>
    <div class="container my-4">
        <div class="card shadow-sm mb-4">
            <div class="card-header py-3">
                <h4 class="mb-0">⚙️ Công Cụ Đọc & Chuyển Đổi JSON Đa Năng</h4>
            </div>
            <div class="card-body bg-white rounded-bottom">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="jsonFile" class="form-label fw-bold text-secondary">1. Tải lên file JSON từ máy:</label>
                        <input class="form-control" type="file" id="jsonFile" accept=".json">
                    </div>
                    <div class="col-md-6">
                        <label for="jsonText" class="form-label fw-bold text-secondary">Hoặc dán trực tiếp nội dung JSON:</label>
                        <div class="input-group">
                            <textarea class="form-control" id="jsonText" rows="1" placeholder="Dán chuỗi JSON vào đây..."></textarea>
                            <button class="btn btn-outline-primary" type="button" id="btnLoadText">Phân tích</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Khu vực hiển thị kết quả sau khi đọc JSON -->
        <div id="resultContainer" class="card shadow-sm" style="display: none;">
            <div class="card-header d-flex justify-content-between align-items-center py-3">
                <h4 class="mb-0" id="resultTitle">Dữ Liệu Trực Tuyến</h4>
                <button id="btnDownload" class="btn btn-success fw-bold btn-sm">
                    📥 Tải Xuống Excel
                </button>
            </div>
            <div class="card-body bg-white rounded-bottom">
                <!-- Thông tin meta tổng quan -->
                <div id="metaInfo" class="row mb-3 p-3 bg-light rounded border" style="display: none;"></div>

                <!-- Bảng hiển thị dữ liệu linh hoạt -->
                <div class="table-responsive">
                    <table class="table table-bordered table-hover align-middle" id="dynamicTable">
                        <thead>
                            <tr>
                                <th class="text-center">STT</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Dữ liệu -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        let currentParsedData = null;

        document.getElementById('jsonFile').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const jsonData = JSON.parse(e.target.result);
                    processAndRender(jsonData);
                } catch (err) {
                    alert('Lỗi: File JSON không hợp lệ! (' + err.message + ')');
                }
            };
            reader.readAsText(file);
        });

        document.getElementById('btnLoadText').addEventListener('click', function() {
            const text = document.getElementById('jsonText').value.trim();
            if (!text) {
                alert('Vui lòng nhập hoặc dán nội dung JSON!');
                return;
            }
            try {
                const jsonData = JSON.parse(text);
                processAndRender(jsonData);
            } catch (err) {
                alert('Lỗi: Định dạng JSON không hợp lệ! (' + err.message + ')');
            }
        });

        function processAndRender(data) {
            currentParsedData = data;
            document.getElementById('resultContainer').style.display = 'block';

            let rows = [];
            let metaFields = {};

            if (Array.isArray(data)) {
                rows = data;
            } else if (typeof data === 'object' && data !== null) {
                for (let key in data) {
                    if (Array.isArray(data[key])) {
                        rows = data[key];
                        break;
                    } else if (typeof data[key] === 'object' && data[key] !== null) {
                        for (let subKey in data[key]) {
                            if (Array.isArray(data[key][subKey])) {
                                rows = data[key][subKey];
                                break;
                            }
                        }
                    }
                }
                if (rows.length === 0 && data.document && data.document.data) {
                    const innerData = data.document.data;
                    for (let k in innerData) {
                        if (Array.isArray(innerData[k])) {
                            rows = innerData[k];
                            break;
                        }
                    }
                }
                metaFields = extractMeta(data);
            }

            const metaDiv = document.getElementById('metaInfo');
            if (Object.keys(metaFields).length > 0) {
                let htmlMeta = '';
                for (let [k, v] of Object.entries(metaFields)) {
                    htmlMeta += `<div class="col-md-4 mb-1 text-secondary"><strong>${k}:</strong> ${v}</div>`;
                }
                metaDiv.innerHTML = htmlMeta;
                metaDiv.style.display = 'flex';
            } else {
                metaDiv.style.display = 'none';
            }

            if (rows.length === 0 && Array.isArray(data)) {
                rows = data;
            }

            if (rows.length === 0) {
                alert('Không tìm thấy danh sách dữ liệu dạng bảng (mảng) trong cấu trúc JSON này.');
                return;
            }

            const sampleItem = rows[0];
            const keys = Object.keys(sampleItem);

            const table = document.getElementById('dynamicTable');
            const thead = table.querySelector('thead');
            let headerHtml = '<tr><th class="text-center">STT</th>';
            keys.forEach(k => {
                headerHtml += `<th>${k}</th>`;
            });
            headerHtml += '</tr>';
            thead.innerHTML = headerHtml;

            const tbody = table.querySelector('tbody');
            let bodyHtml = '';
            rows.forEach((item, index) => {
                bodyHtml += `<tr><td class="text-center text-muted">${index + 1}</td>`;
                keys.forEach(k => {
                    let val = item[k] !== undefined && item[k] !== null ? item[k] : '';
                    bodyHtml += `<td>${val}</td>`;
                });
                bodyHtml += `</tr>`;
            });
            tbody.innerHTML = bodyHtml;
        }

        function extractMeta(obj, prefix = '') {
            let res = {};
            for (let k in obj) {
                if (typeof obj[k] !== 'object' && obj[k] !== null) {
                    res[prefix + k] = obj[k];
                } else if (obj[k] !== null && !Array.isArray(obj[k])) {
                    Object.assign(res, extractMeta(obj[k], prefix + k + '.'));
                }
            }
            return res;
        }

        document.getElementById('btnDownload').addEventListener('click', function() {
            if (!currentParsedData) return;
            
            const wb = XLSX.utils.book_new();
            let rows = [];
            if (Array.isArray(currentParsedData)) {
                rows = currentParsedData;
            } else {
                function findFirstArray(obj) {
                    for (let k in obj) {
                        if (Array.isArray(obj[k])) return obj[k];
                        if (typeof obj[k] === 'object' && obj[k] !== null) {
                            let found = findFirstArray(obj[k]);
                            if (found) return found;
                        }
                    }
                    return null;
                }
                rows = findFirstArray(currentParsedData) || [currentParsedData];
            }

            const ws = XLSX.utils.json_to_sheet(rows);
            XLSX.utils.book_append_sheet(wb, ws, "DuLieuJSON");
            XLSX.writeFile(wb, "XuatDuLieu_JSON.xlsx");
        });
    </script>
</body>
</html>
